<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador de GeoDatos · Bolivia</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f4f1e9;          /* papel */
    --ink:#1a1f1c;         /* tinta */
    --paper:#fbfaf5;
    --line:#cfc9b8;
    --accent:#1f6b4f;      /* verde topográfico */
    --accent-2:#c5532b;    /* terracota */
    --muted:#6b6657;
    --shadow:rgba(26,31,28,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Spline Sans Mono',monospace;
    font-size:15px;line-height:1.5;
    background-image:
      repeating-linear-gradient(0deg,transparent,transparent 38px,rgba(31,107,79,.04) 39px),
      repeating-linear-gradient(90deg,transparent,transparent 38px,rgba(31,107,79,.04) 39px);
  }
  header{
    border-bottom:2px solid var(--ink);
    padding:22px clamp(16px,4vw,48px) 18px;
    display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;justify-content:space-between;
    background:var(--paper);
  }
  .brand h1{
    font-family:'Fraunces',serif;font-weight:900;
    font-size:clamp(26px,4.5vw,44px);line-height:.95;margin:0;letter-spacing:-.02em;
  }
  .brand p{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:46ch}
  .brand .accent{color:var(--accent-2)}
  header .src{font-size:12px;color:var(--muted);text-align:right}
  header .src a{color:var(--accent);text-decoration:none;border-bottom:1px dotted}

  main{
    display:grid;grid-template-columns:minmax(330px,400px) 1fr;
    gap:0;min-height:calc(100vh - 92px);
  }
  @media(max-width:880px){main{grid-template-columns:1fr}}

  .panel{
    padding:clamp(16px,3vw,30px);
    border-right:2px solid var(--ink);
    background:var(--paper);
    overflow-y:auto;
  }
  @media(max-width:880px){.panel{border-right:none;border-bottom:2px solid var(--ink)}}

  .step{margin-bottom:26px;opacity:.45;transition:opacity .25s;pointer-events:none}
  .step.active{opacity:1;pointer-events:auto}
  .step .num{
    display:inline
