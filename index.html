<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Explorador Geodatos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>Catálogo de Mapas</h2>
        <div class="row g-3 mt-2">
            <div class="col-md-6">
                <select id="cat" class="form-select" onchange="procesarCSV()">
                    <option value="">-- Seleccione Catálogo --</option>
                    <option value="https://raw.githubusercontent.com/mauforonda/geodatos/master/archivar/paquetes.csv">IDE's de Bolivia</option>
                    <option value="https://raw.githubusercontent.com/mauforonda/geodatos/master/archivar/geobolivia_2021/catalogo.csv">GeoBolivia v2021</option>
                </select>
            </div>
            <div class="col-md-6">
                <select id="subcat" class="form-select" onchange="mostrarDetalle()">
                    <option value="">-- Seleccione Mapa --</option>
                </select>
            </div>
        </div>

        <div id="resultado" class="card mt-4 p-3 shadow-sm" style="display:none;">
            <h4 id="tituloMapa"></h4>
            <div class="row">
                <div class="col-md-4">
                    <img id="imgCover" src="" class="img-fluid border" alt="Cover">
                </div>
                <div class="col-md-8 d-flex align-items-center">
                    <a id="btnDescarga" href="#" class="btn btn-success btn-lg" target="_blank">Descargar Archivo</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let datosCSV = [];

        async function procesarCSV() {
            const url = document.getElementById('cat').value;
            const selectSub = document.getElementById('subcat');
            
            // Limpieza
            selectSub.innerHTML = '<option value="">-- Seleccione Mapa --</option>';
            document.getElementById('resultado').style.display = 'none';
            if(!url) return;

            const res = await fetch(url);
            const texto = await res.text();
            const config = Papa.parse(texto, { header: true, skipEmptyLines: true });
            datosCSV = config.data;

            // Detección automática de columnas
            const keys = Object.keys(datosCSV[0]);
            const colNombre = keys.find(k => /nombre|title|titulo/i.test(k)) || keys[0];

            datosCSV.forEach((fila, index) => {
                const nombre = fila[colNombre] || "Sin nombre";
                selectSub.innerHTML += `<option value="${index}">${nombre}</option>`;
            });
        }

        function mostrarDetalle() {
            const idx = document.getElementById('subcat').value;
            if(idx === "") return;

            const fila = datosCSV[idx];
            const keys = Object.keys(fila);
            
            // Búsqueda inteligente de identificador y archivo
            const id = fila.id || fila.identificador || fila.ID || fila[keys[0]]; 
            const archivo = fila.archivo || fila.filename || keys[keys.length-1];

            document.getElementById('tituloMapa').innerText = fila[keys.find(k => /nombre|title|titulo/i.test(k))];
            document.getElementById('imgCover').src = `https://archive.org/download/${id}/cover.png`;
            document.getElementById('btnDescarga').href = `https://archive.org/download/${id}/${archivo}`;
            document.getElementById('resultado').style.display = 'block';
        }
    </script>
</body>
</html>
