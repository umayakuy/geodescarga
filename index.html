<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo Geodatos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

            </div>
            <div class="col-md-6" id="subContainer" style="display:none;">

                <select id="subcat" class="form-select" onchange="displayMap()">

                </select>
            </div>
        </div>

        <div id="displayArea" class="mt-4 p-3 bg-white border rounded shadow-sm" style="display:none;">
            <h4 id="mapTitle"></h4>
            <img id="coverImg" src="" class="img-fluid my-3" style="max-width: 300px; display: block;">
            <a id="downloadBtn" href="#" class="btn btn-primary" target="_blank">Descargar Archivo</a>
        </div>
    </div>
