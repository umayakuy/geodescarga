<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Visor de Catálogo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  body { font-family: sans-serif; background: #f4f1e9; display: flex; height: 100vh; margin: 0; }
  .panel { width: 350px; padding: 20px; border-right: 2px solid #1a1f1c; overflow-y: auto; }
  .viewer { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .fileitem { padding: 10px; cursor: pointer; border-bottom: 1px solid #ccc; }
  .fileitem:hover { background: #e0dccc; }
  #coverImg { max-width: 100%; max-height: 80vh; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
</style>
</head>
<body>

<section class="panel">
  <h2>Catálogo</h2>
  <div id="fileList"></div>
</section>

<section class="viewer">
  <div id="displayArea">Selecciona un archivo para ver su portada.</div>
</section>

<script>
const REPO = "mauforonda/geodatos";
const BRANCH = "master";
// Lista fija de archivos permitidos
const ALLOWED_FILES = [
  "archivar/paquetes.csv",
  "archivar/geobolivia_2021/catalogo.csv"
];

async function init() {
  const listDiv = document.getElementById("fileList");
  
  for (const path of ALLOWED_FILES) {
    const btn = document.createElement("div");
    btn.className = "fileitem";
    btn.textContent = path.split('/').pop();
    btn.onclick = () => loadCSV(path);
    listDiv.appendChild(btn);
  }
}

function loadCSV(path) {
  const url = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${path}`;
  Papa.parse(url, {
    download: true, header: true,
    complete: res => {
      const listDiv = document.getElementById("fileList");
      // Limpiamos los ítems anteriores para poner las filas del CSV
      listDiv.innerHTML = `<h3>Contenido: ${path.split('/').pop()}</h3>`;
      res.data.forEach((row, i) => {
        if (!row.identifier) return;
        const item = document.createElement("div");
        item.className = "fileitem";
        item.textContent = row.titulo || "Elemento " + i;
        item.onclick = () => showCover(row.identifier);
        listDiv.appendChild(item);
      });
    }
  });
}

function showCover(identifier) {
  const display = document.getElementById("displayArea");
  // URL directa de la imagen generada en Archive.org
  const imgUrl = `https://archive.org/download/${identifier}/cover.png`;
  
  display.innerHTML = `<img id="coverImg" src="${imgUrl}" onerror="this.src='https://via.placeholder.com/300?text=Sin+Portada';">`;
}

init();
</script>
</body>
</html>
