<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Explorador Rápido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-4">
        <select id="cat" class="form-select mb-3" onchange="cargarCatalogo()">
            <option value="">1. Seleccione Categoría</option>
            <option value="https://raw.githubusercontent.com/mauforonda/geodatos/master/archivar/paquetes.csv">IDE's de Bolivia</option>
            <option value="https://raw.githubusercontent.com/mauforonda/geodatos/master/archivar/geobolivia_2021/catalogo.csv">GeoBolivia v2021</option>
        </select>

        <select id="subcat" class="form-select mb-3" onchange="filtrarMapas()" disabled>
            <option value="">2. Seleccione Subcategoría (si existe)</option>
        </select>

        <select id="mapa" class="form-select mb-3" onchange="mostrarMapa()" disabled>
            <option value="">3. Seleccione Mapa</option>
        </select>

        <div id="resultado" class="card p-3 shadow-sm" style="display:none;">
            <h4 id="mapTitle"></h4>
            <img id="coverImg" src="" class="img-fluid border my-2" style="max-width:300px;">
            <br>
            <a id="downloadBtn" href="#" class="btn btn-primary" target="_blank">Descargar</a>
        </div>
    </div>

    <script>
        let datosGlobales = [];

        async function cargarCatalogo() {
            const url = document.getElementById('cat').value;
            if(!url) return;
            
            // Descarga una sola vez y almacena en memoria
            const res = await fetch(url);
            const text = await res.text();
            datosGlobales = Papa.parse(text, { header: true }).data;

            // Habilitar subcategoría (suponiendo que hay una columna 'categoria')
            const sub = document.getElementById('subcat');
            sub.disabled = false;
            sub.innerHTML = '<option value="">Todas</option>';
            
            const cats = [...new Set(datosGlobales.map(d => d.categoria || d.grupo || "General"))];
            cats.forEach(c => sub.innerHTML += `<option value="${c}">${c}</option>`);
        }

        function filtrarMapas() {
            const catSel = document.getElementById('subcat').value;
            const mapaSel = document.getElementById('mapa');
            mapaSel.disabled = false;
            mapaSel.innerHTML = '<option value="">Seleccione mapa...</option>';

            const filtrados = catSel === "" ? datosGlobales : 
                              datosGlobales.filter(d => (d.categoria || d.grupo || "General") === catSel);

            filtrados.forEach((m, i) => {
                mapaSel.innerHTML += `<option value="${i}">${m.nombre || m.title}</option>`;
            });
        }

        function mostrarMapa() {
            const idx = document.getElementById('mapa').value;
            if(idx === "") return;
            
            const item = datosGlobales[idx];
            document.getElementById('mapTitle').innerText = item.nombre || item.title;
            document.getElementById('coverImg').src = `https://archive.org/download/${item.id}/cover.png`;
            document.getElementById('downloadBtn').href = `https://archive.org/download/${item.id}/${item.archivo || item.id + '.geojson'}`;
            document.getElementById('resultado').style.display = 'block';
        }
    </script>
</body>
</html>
