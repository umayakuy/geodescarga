<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Descarga de Mapas - Soberanía Tecnológica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Explorador de Mapas</h2>
        
        <div class="row g-3">
            <div class="col-md-4">
                <select id="cat" class="form-select" onchange="loadSub()">
                    <option value="">Seleccione Categoría</option>
                    <option value="https://raw.githubusercontent.com/mauforonda/geodatos/master/archivar/paquetes.csv">IDE's de Bolivia</option>
                    <option value="https://raw.githubusercontent.com/mauforonda/geodatos/master/archivar/geobolivia_2021/catalogo.csv">GeoBolivia v2021</option>
                </select>
            </div>
            <div class="col-md-4" id="subContainer" style="display:none;">
                <select id="subcat" class="form-select" onchange="displayMap()"></select>
            </div>
        </div>

        <div id="displayArea" class="mt-4 p-3 bg-white border rounded shadow-sm" style="display:none;">
            <h4 id="mapTitle"></h4>
            <img id="coverImg" src="" class="img-fluid my-3" style="max-height: 300px;">
            <br>
            <a id="downloadBtn" href="#" class="btn btn-primary" target="_blank">Descargar Mapa</a>
        </div>
    </div>

    <script>
        let currentData = [];

        async function loadSub() {
            const url = document.getElementById('cat').value;
            if (!url) return;

            const response = await fetch(url);
            const csvText = await response.text();
            const results = Papa.parse(csvText, { header: true });
            currentData = results.data;

            const sub = document.getElementById('subcat');
            sub.innerHTML = '<option>Seleccione un mapa...</option>';
            
            // Suponemos que el CSV tiene columnas 'nombre' e 'id' (ajustar según el CSV real)
            currentData.forEach((row, index) => {
                if (row.nombre) {
                    sub.innerHTML += `<option value="${index}">${row.nombre}</option>`;
                }
            });
            document.getElementById('subContainer').style.display = 'block';
        }

        function displayMap() {
            const idx = document.getElementById('subcat').value;
            const item = currentData[idx];
            
            document.getElementById('mapTitle').innerText = item.nombre;
            // Construcción dinámica de la URL en Archive.org
            document.getElementById('coverImg').src = `https://archive.org/download/${item.id}/cover.png`;
            document.getElementById('downloadBtn').href = `https://archive.org/download/${item.id}/${item.archivo}`;
            
            document.getElementById('displayArea').style.display = 'block';
        }
    </script>
</body>
</html>
